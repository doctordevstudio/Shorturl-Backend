services:
  - type: web
    name: dekho-hatke-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - {key: BOT_TOKEN, sync: false}
      - {key: SITE_URL, value: "https://dekhohatke.com"}
      - {key: PROXY_SECRET, sync: false}
      - {key: WEBHOOK_SECRET, sync: false}
